name: Tests

on:
  pull_request:
    branches:
      - v2

jobs:
  acceptance-in-memory:
    name: Acceptance Tests (In-Memory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance tests (in-memory)
        run: pnpm test:acceptance:in-memory
        env:
          CI: true

  acceptance-drizzle:
    name: Acceptance Tests (Drizzle/PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance tests (drizzle)
        run: pnpm test:acceptance:drizzle
        env:
          CI: true

  acceptance-e2e:
    name: Acceptance Tests (E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance tests (e2e)
        run: pnpm test:acceptance:e2e
        env:
          CI: true
