name: Tests

on:
  pull_request:
    branches:
      - v2

jobs:
  acceptance-in-memory:
    name: Acceptance Tests (In-Memory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance tests (in-memory)
        run: pnpm test:acceptance:in-memory
        env:
          CI: true

  acceptance-drizzle:
    name: Acceptance Tests (Drizzle/PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance tests (drizzle)
        run: pnpm test:acceptance:drizzle
        env:
          CI: true

  acceptance-cypress:
    name: Acceptance Tests (Cypress)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS
        run: pnpm css:build

      # Supabase + server startup is managed by scripts/run-cypress-e2e.ts
      # which uses Testcontainers for Supabase
      - name: Run Cypress tests
        run: pnpm test:acceptance:e2e
        env:
          CI: true

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
